<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Food Donation Connect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --accent-1: #ff9a76;
            --accent-2: #ff5e62;
            --accent-gradient: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            --card-radius: 1rem;
            --glass-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        * { font-family: 'Poppins', sans-serif; }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--accent-gradient);
        }

        .bg-animated::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(120deg, #ffd4b2, #ff9a76, #ff5e62, #b5173a);
            background-size: 180% 180%;
            animation: gradientShift 12s ease infinite;
            filter: blur(30px) saturate(110%);
            opacity: 0.95;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        }

        .card-custom {
            background: white;
            border-radius: var(--card-radius);
            box-shadow: var(--glass-shadow);
            border: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card-custom:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.18);
        }

        .btn-gradient {
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-gradient:hover {
            opacity: 0.9;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255,94,98,0.3);
        }

        .btn-outline-custom {
            border: 2px solid white;
            color: white;
            border-radius: 10px;
            font-weight: 500;
            background: transparent;
            transition: all 0.2s ease;
        }

        .btn-outline-custom:hover {
            background: white;
            color: var(--accent-2);
        }

        .btn-report {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-report:hover {
            background: #333;
            color: white;
            border-color: #444;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
        }

        .form-control:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(255,94,98,0.15);
        }

        .badge-status {
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-accepted { background: #cce5ff; color: #004085; }
        .badge-picked_up { background: #d4edda; color: #155724; }
        .badge-expired { background: #f8d7da; color: #721c24; }

        .distance-badge {
            background: #f0f0f0;
            color: #333;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast-custom {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: none;
            padding: 16px 20px;
            margin-bottom: 10px;
            min-width: 300px;
            max-width: 400px;
            animation: slideIn 0.3s ease;
            border-left: 4px solid var(--accent-2);
        }

        .toast-custom.success { border-left-color: #28a745; }
        .toast-custom.error { border-left-color: #dc3545; }
        .toast-custom.info { border-left-color: #17a2b8; }
        .toast-custom.warning { border-left-color: #ffc107; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .toast-header-custom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .toast-title { font-weight: 600; color: #333; }
        .toast-body-custom { color: #555; font-size: 14px; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.9);
        }

        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.7; }
        .empty-state h5 { font-weight: 600; margin-bottom: 8px; }
        .empty-state p { opacity: 0.8; }

        .pulse-ring {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-2);
            animation: pulse 2s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .listing-card {
            position: relative;
        }

        .listing-card.new::before {
            content: "NEW";
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--accent-gradient);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #map { height: 300px; border-radius: 12px; }
        .leaflet-popup-content-wrapper { border-radius: 12px; }
        .leaflet-popup-tip { background: white; }

        .stat-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 24px;
            color: white;
            text-align: center;
        }

        .stat-card .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-card .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 8px;
        }

        .nav-link-custom {
            color: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .nav-link-custom:hover,
        .nav-link-custom.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        @media (max-width: 768px) {
            .toast-container { left: 10px; right: 10px; }
            .toast-custom { min-width: auto; max-width: none; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-animated">
    <div class="bg-overlay" aria-hidden="true"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    {% block content %}{% endblock %}

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Global Socket.IO connection
        const socket = io({
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 1000
        });

        socket.on('connect', () => {
            console.log('Socket connected:', socket.id);
            {% if session.get('organizer_id') %}
                socket.emit('join_organizer', {});
            {% elif session.get('ngo_id') %}
                socket.emit('join_ngo', {});
            {% endif %}
        });

        socket.on('disconnect', (reason) => {
            console.log('Socket disconnected:', reason);
        });

        socket.on('connect_error', (error) => {
            console.error('Socket connection error:', error);
        });

        // Toast notification system
        function showToast(message, type = 'info', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-custom ${type}`;
            toast.innerHTML = `
                <div class="toast-header-custom">
                    <span class="toast-title">${title || getToastTitle(type)}</span>
                    <button type="button" class="btn-close btn-close-white" onclick="this.parentElement.parentElement.remove()"></button>
                </div>
                <div class="toast-body-custom">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }

        function getToastTitle(type) {
            const titles = {
                'success': '<i class="bi bi-check-circle-fill text-success"></i> Success',
                'error': '<i class="bi bi-x-circle-fill text-danger"></i> Error',
                'warning': '<i class="bi bi-exclamation-triangle-fill text-warning"></i> Warning',
                'info': '<i class="bi bi-info-circle-fill text-info"></i> Info'
            };
            return titles[type] || titles.info;
        }

        // Real-time event handlers
        socket.on('new_listing', (data) => {
            showToast(
                `New food donation: ${data.food_type} (${data.quantity}) from ${data.organizer_name}`,
                'info',
                '<i class="bi bi-bell-fill text-info"></i> New Donation Available'
            );
            // Trigger dashboard refresh if on NGO dashboard
            if (typeof refreshListings === 'function') {
                refreshListings();
            }
        });

        socket.on('listing_updated', (data) => {
            if (typeof refreshListings === 'function') {
                refreshListings();
            }
        });

        socket.on('listing_accepted', (data) => {
            showToast(
                `Your listing was accepted by ${data.ngo_name}!`,
                'success',
                '<i class="bi bi-check-circle-fill text-success"></i> Listing Accepted'
            );
            if (typeof refreshMyListings === 'function') {
                refreshMyListings();
            }
        });

        // AJAX helper
        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    ...options.headers
                },
                ...options
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Request failed');
            }
            return data;
        }

        // Format date for display
        function formatDateTime(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
